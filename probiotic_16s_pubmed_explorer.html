  .field { display: flex; flex-direction: column; font-size: 13px; max-width: 640px; }
  .field label { font-weight: 600; margin-bottom: 4px; }

  .brand-banner { background: #eef6f3; border: 1px solid #cce3da; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .layout { display: grid; grid-template-columns: 1.05fr 1.35fr; gap: 12px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .panel-header { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #222; display: flex; justify-content: space-between; gap: 8px; }
  .org-list { list-style: none; padding: 0; margin: 0; max-height: 380px; overflow-y: auto; }
  .org-btn { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 12.5px; border: 1px solid #e2e2e2; background: #fff; color: #222; margin-bottom: 5px; }
  .org-btn:hover, .org-btn:focus { background: #eef6f3; border-color: #137356; outline: 2px solid #137356; outline-offset: 1px; }
  .org-btn.active { background: #e3f2ed; border-color: #137356; font-weight: 600; }
  .strain-tag { font-size: 11px; background: #eef2f6; color: #1b4f72; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .detail-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; gap: 8px; }
  .detail-header h3 { margin: 0; font-size: 15px; color: #137356; }
  .count-pill { background: #1b4f72; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .meta-line { font-size: 12px; color: #444; margin-bottom: 10px; }
  .rec-card { border: 1px solid #e3e7ea; border-radius: 5px; padding: 8px 10px; margin-bottom: 8px; background: #fcfdfd; font-size: 12px; }
  .rec-title { font-weight: 600; color: #1b4f72; margin-bottom: 3px; }
  .rec-meta { color: #555; font-size: 11px; margin-bottom: 6px; }
  .action-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mini-btn { padding: 4px 8px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1px solid #1b4f72; background: #eef4f8; color: #1b4f72; cursor: pointer; }
  .mini-btn:hover { background: #dce9f2; }
  .ext-link { font-size: 11.5px; font-weight: 600; color: #137356; text-decoration: none; }
  .ext-link:hover { text-decoration: underline; }
  .seq-box { margin-top: 8px; background: #f4f6f8; border: 1px solid #d8dee4; border-radius: 4px; padding: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 170px; overflow-y: auto; color: #222; }
  .note-box { background: #fff9eb; border: 1px solid #f2dfb3; color: #5c4400; border-radius: 5px; padding: 8px 10px; font-size: 12px; margin-bottom: 8px; }
</style>

let currentCode = "JARR";
let selectedIdx = 0;
const recordCache = {};
const seqCache = {};

function cleanStrain(str) {
  return (str || "").replace(/[®™]/g, "").trim();
}

function initSelect() {
  const sel = document.getElementById("product-select");
  sel.innerHTML = "";
  Object.keys(catalog).forEach(code => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = code + " — " + catalog[code].fullTitle;
    if (code === currentCode) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    currentCode = sel.value;
    selectedIdx = 0;
    renderAll();
    load16SRecords(0);
  });
}

function renderList() {
  const orgs = catalog[currentCode].organisms;
  document.getElementById("org-count").textContent = orgs.length + " listed " + (orgs.length === 1 ? "organism" : "organisms");
  document.getElementById("org-list").innerHTML = orgs.map((org, i) => {
    const isSelected = i === selectedIdx;
    return `
      <li>
        <button type="button" class="org-btn ${isSelected ? "active" : ""}" aria-pressed="${isSelected}" onclick="load16SRecords(${i})">
          <span>${org.label}</span>
          <span class="strain-tag">${org.strain || "Species only"}</span>
        </button>
      </li>`;
  }).join("");
}

function renderAll() {
  const item = catalog[currentCode];
  document.getElementById("brand-banner").innerHTML = `
    <div><strong>Sample ID:</strong> ${currentCode} · <strong>Product:</strong> ${item.fullTitle}</div>
    <div><strong>Biosafety:</strong> ${item.bsl}</div>
  `;
  renderList();
}

async function fetchNuccore16S(term) {
  const url = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=nuccore&term=" + encodeURIComponent(term) + "&retmode=json&retmax=4";
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("Search failed");
  const json = await resp.json();
  const count = parseInt(json.esearchresult.count, 10) || 0;
  const ids = json.esearchresult.idlist || [];
  if (ids.length === 0) return { count, records: [] };

  const sumUrl = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=nuccore&id=" + ids.join(",") + "&retmode=json";
  const sumResp = await fetch(sumUrl);
  if (!sumResp.ok) throw new Error("Summary failed");
  const sumJson = await sumResp.json();

  const records = ids.map(id => {
    const item = (sumJson.result && sumJson.result[id]) || {};
    return {
      uid: id,
      accession: item.accessionversion || item.caption || id,
      title: item.title || "16S ribosomal RNA sequence",
      length: item.slen ? item.slen + " bp" : "Length unlisted"
    };
  });
  return { count, records };
}

function createSequenceBox(slotId, text) {
  const host = document.getElementById(slotId);
  if (!host) return;
  host.innerHTML = `<div class="seq-box">${text}</div>`;
}

async function toggleSequence(uid, accession, slotId, btnEl) {
  const host = document.getElementById(slotId);
  if (!host) return;
  if (host.innerHTML.trim() !== "") {
    host.innerHTML = "";
    btnEl.textContent = "Show DNA sequence";
    return;
  }
  createSequenceBox(slotId, "Loading DNA sequence...");
  if (seqCache[uid]) {
    createSequenceBox(slotId, seqCache[uid]);
    btnEl.textContent = "Hide DNA sequence";
    return;
  }
  try {
    const fastaUrl = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id=" + encodeURIComponent(uid) + "&rettype=fasta&retmode=text";
    const resp = await fetch(fastaUrl);
    if (!resp.ok) throw new Error("Sequence fetch failed");
    const text = (await resp.text()).trim();
    seqCache[uid] = text || ("No DNA sequence returned for " + accession);
    createSequenceBox(slotId, seqCache[uid]);
    btnEl.textContent = "Hide DNA sequence";
  } catch (e) {
    createSequenceBox(slotId, "Could not load DNA sequence for " + accession + ".");
  }
}

async function load16SRecords(idx) {
  selectedIdx = idx;
  renderList();

  const org = catalog[currentCode].organisms[idx];
  const panel = document.getElementById("detail-panel");
  const blastUrl = "https://blast.ncbi.nlm.nih.gov/Blast.cgi?PROGRAM=blastn&PAGE_TYPE=BlastSearch&DATABASE=16S_ribosomal_RNA";
  const isFungal = /^Saccharomyces/i.test(org.species);

  if (isFungal) {
    panel.innerHTML = `
      <div class="detail-header">
        <h3>${org.label}</h3>
        <span class="count-pill">Fungal / Non-16S</span>
      </div>
      <div class="note-box">
        <strong>Note on 16S rRNA:</strong> <em>${org.species}</em> is a yeast (fungi do not encode prokaryotic 16S rRNA; fungal identification typically uses ITS or 28S rRNA).
      </div>
      <a class="ext-link" href="${blastUrl}" target="_blank" rel="noopener">Open NCBI BLAST ↗</a>
    `;
    return;
  }

  const cleanStr = cleanStrain(org.strain);
  const cacheKey = org.species + "|" + cleanStr;
  const strainTerm = cleanStr
    ? `"${org.species}"[Organism] AND "${cleanStr}" AND ("16S ribosomal RNA" OR "16S rRNA")`
    : "";
  const speciesTerm = `"${org.species}"[Organism] AND ("16S ribosomal RNA" OR "16S rRNA")`;

  panel.innerHTML = `
    <div class="detail-header">
      <h3>${org.label}</h3>
      <span class="count-pill">Loading 16S...</span>
    </div>
    <p style="font-size:12px; color:#555;">Fetching 16S rRNA sequence records from NCBI Nucleotide...</p>
  `;

  try {
    let data = recordCache[cacheKey];
    if (!data) {
      let result = null;
      let scope = "Species";
      if (strainTerm) {
        const strainRes = await fetchNuccore16S(strainTerm);
        if (strainRes.records.length > 0) {
          result = strainRes;
          scope = "Strain-matched (" + cleanStr + ")";
        }
      }
      if (!result) {
        result = await fetchNuccore16S(speciesTerm);
        scope = cleanStr ? "Species fallback (no exact strain 16S hit)" : "Species-level";
      }
      data = { scope, count: result.count, records: result.records, searchTerm: cleanStr && scope.startsWith("Strain") ? strainTerm : speciesTerm };
      recordCache[cacheKey] = data;
    }

    const nucSearchUrl = "https://www.ncbi.nlm.nih.gov/nuccore/?term=" + encodeURIComponent(data.searchTerm);
    const cardsHtml = data.records.length === 0
      ? `<p style="font-size:12px; color:#555;">No 16S rRNA nucleotide records found for this query.</p>`
      : data.records.map((rec, rIdx) => {
          const slotId = `seq-slot-${idx}-${rIdx}`;
          const genbankUrl = `https://www.ncbi.nlm.nih.gov/nuccore/${encodeURIComponent(rec.accession)}`;
          return `
            <div class="rec-card">
              <div class="rec-title">${rec.title}</div>
              <div class="rec-meta"><strong>Accession:</strong> ${rec.accession} · <strong>Length:</strong> ${rec.length}</div>
              <div class="action-row">
                <button type="button" class="mini-btn" onclick="toggleSequence('${rec.uid}', '${rec.accession}', '${slotId}', this)">Show DNA sequence</button>
                <a class="ext-link" href="${genbankUrl}" target="_blank" rel="noopener">GenBank Record ↗</a>
              </div>
              <div id="${slotId}"></div>
            </div>`;
        }).join("");

    panel.innerHTML = `
      <div class="detail-header">
        <h3>${org.label}</h3>
        <span class="count-pill">${data.count} 16S ${data.count === 1 ? "Record" : "Records"}</span>
      </div>
      <div class="meta-line"><strong>Species:</strong> <em>${org.species}</em> · <strong>Strain:</strong> ${org.strain || "Not listed"} · <strong>Match:</strong> ${data.scope}</div>
      ${cardsHtml}
      <div class="action-row" style="margin-top:8px;">
        <a class="ext-link" href="${nucSearchUrl}" target="_blank" rel="noopener">Browse All 16S on NCBI Nucleotide ↗</a>
        <a class="ext-link" href="${blastUrl}" target="_blank" rel="noopener">Open NCBI BLAST (16S rRNA DB) ↗</a>
      </div>
    `;
  } catch (err) {
    panel.innerHTML = `
      <div class="detail-header"><h3>${org.label}</h3></div>
      <div class="note-box">Could not load 16S records directly inside the frame.</div>
      <div class="action-row">
        <a class="ext-link" href="https://www.ncbi.nlm.nih.gov/nuccore/?term=${encodeURIComponent(speciesTerm)}" target="_blank" rel="noopener">Search 16S on NCBI Nucleotide ↗</a>
        <a class="ext-link" href="${blastUrl}" target="_blank" rel="noopener">Open NCBI BLAST (16S rRNA DB) ↗</a>
      </div>
    `;
  }
}

initSelect();
renderAll();
