<!DOCTYPE html>

<meta charset="UTF-8">
<title>Probiotic Label Explorer — PubMed & 16S rRNA Reference Links</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 12px; color: #222; background: #fafafa; }
  .top-bar { background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; font-size: 13px; max-width: 620px; }
  .field label { font-weight: 600; margin-bottom: 4px; }
  select { padding: 7px 9px; border: 1px solid #bbb; border-radius: 4px; font-size: 13px; background: #fff; color: #222; }
  .brand-banner { background: #eef6f3; border: 1px solid #cce3da; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .layout { display: grid; grid-template-columns: 1.05fr 1.25fr; gap: 12px; align-items: start; }
  @media (max-width: 740px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .panel-header { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #222; display: flex; justify-content: space-between; gap: 8px; }
  .org-list { list-style: none; padding: 0; margin: 0; max-height: 360px; overflow-y: auto; }
  .org-btn { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 12.5px; border: 1px solid #e2e2e2; background: #fff; color: #222; margin-bottom: 5px; }
  .org-btn:hover, .org-btn:focus { background: #eef6f3; border-color: #137356; outline: 2px solid #137356; outline-offset: 1px; }
  .org-btn.active { background: #e3f2ed; border-color: #137356; font-weight: 600; }
  .strain-tag { font-size: 11px; background: #eef2f6; color: #1b4f72; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .pubmed-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; gap: 8px; }
  .pubmed-header h3 { margin: 0; font-size: 15px; color: #137356; }
  .count-pill { background: #1b4f72; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .meta-line { font-size: 12px; color: #444; margin-bottom: 8px; }
  .paper-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
  .paper-list li { padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
  .paper-list li:last-child { border-bottom: none; }
  .paper-title { font-weight: 600; color: #1b4f72; text-decoration: none; display: block; margin-bottom: 2px; }
  .paper-title:hover { text-decoration: underline; }
  .paper-meta { color: #555; font-size: 11px; }
  .ext-link { display: inline-block; margin-top: 8px; margin-right: 12px; font-size: 12px; font-weight: 600; color: #137356; text-decoration: none; }
  .ext-link:hover { text-decoration: underline; }
  .sec-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e6e6e6; }
  .sec-title { font-size: 13px; font-weight: 700; color: #1b4f72; margin: 0 0 6px 0; }
</style>
</head>

let currentCode = "JARR";
let selectedIdx = 0;
const cache = {};

function initSelect() {
  const sel = document.getElementById("product-select");
  sel.innerHTML = "";
  Object.keys(catalog).forEach(code => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = code + " — " + catalog[code].fullTitle;
    if (code === currentCode) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    currentCode = sel.value;
    selectedIdx = 0;
    renderAll();
    queryDetails(0);
  });
}

function renderList() {
  const orgs = catalog[currentCode].organisms;
  document.getElementById("org-count").textContent = orgs.length + " listed " + (orgs.length === 1 ? "organism" : "organisms");
  document.getElementById("org-list").innerHTML = orgs.map((org, i) => {
    const isSelected = i === selectedIdx;
    return `
      <li>
        <button type="button" class="org-btn ${isSelected ? "active" : ""}" aria-pressed="${isSelected}" onclick="queryDetails(${i})">
          <span>${org.label}</span>
          <span class="strain-tag">${org.strain || "Species only"}</span>
        </button>
      </li>`;
  }).join("");
}

function renderAll() {
  const item = catalog[currentCode];
  document.getElementById("brand-banner").innerHTML = `
    <div><strong>Sample ID:</strong> ${currentCode} · <strong>Product:</strong> ${item.fullTitle}</div>
    <div><strong>Biosafety:</strong> ${item.bsl}</div>
  `;
  renderList();
}

function build16sLinks(org) {
  const isFungal = /^Saccharomyces/i.test(org.species);
  const nucTerm = org.strain
    ? `"${org.species}"[Organism] AND "${org.strain}" AND "16S ribosomal RNA"`
    : `"${org.species}"[Organism] AND "16S ribosomal RNA"`;
  const nucSearchUrl = "https://www.ncbi.nlm.nih.gov/nuccore/?term=" + encodeURIComponent(nucTerm);
  const blastUrl = "https://blast.ncbi.nlm.nih.gov/Blast.cgi?PROGRAM=blastn&PAGE_TYPE=BlastSearch&DATABASE=16S_ribosomal_RNA";
  return { isFungal, nucTerm, nucSearchUrl, blastUrl };
}

async function queryDetails(idx) {
  selectedIdx = idx;
  renderList();

  const org = catalog[currentCode].organisms[idx];
  const panel = document.getElementById("detail-panel");
  const pubmedTerm = org.strain
    ? '"' + org.species + '" AND "' + org.strain + '"'
    : '"' + org.species + '" AND probiotic';
  const pubmedSearchUrl = "https://pubmed.ncbi.nlm.nih.gov/?term=" + encodeURIComponent(pubmedTerm);
  const links16s = build16sLinks(org);
  const cacheKey = org.species + "|" + org.strain;

  if (cache[cacheKey]) {
    panel.innerHTML = cache[cacheKey];
    return;
  }

  panel.innerHTML = `
    <div class="pubmed-header">
      <h3>${org.label}</h3>
      <span class="count-pill">Searching...</span>
    </div>
    <p style="font-size:12px; color:#555;">Querying NIH PubMed & NCBI 16S rRNA records...</p>
  `;

  try {
    const pubmedSearchApi = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=" + encodeURIComponent(pubmedTerm) + "&retmode=json&retmax=3&sort=relevance";
    const pubmedResp = await fetch(pubmedSearchApi);
    const pubmedJson = await pubmedResp.json();

    const totalCount = parseInt(pubmedJson.esearchresult.count, 10) || 0;
    const pmids = pubmedJson.esearchresult.idlist || [];

    let papersHtml = "";
    if (pmids.length === 0) {
      papersHtml = `<p style="font-size:12px; color:#555;">No exact PubMed matches found for this query.</p>`;
    } else {
      const summaryUrl = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=" + pmids.join(",") + "&retmode=json";
      const summaryResp = await fetch(summaryUrl);
      const summaryJson = await summaryResp.json();

      const items = pmids.map(id => {
        const art = summaryJson.result[id];
        const firstAuthor = art.authors && art.authors.length > 0 ? art.authors[0].name + " et al." : "Author unlisted";
        const year = art.pubdate ? art.pubdate.slice(0, 4) : "";
        return `
          <li>
            <a class="paper-title" href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank" rel="noopener">${art.title}</a>
            <div class="paper-meta">${firstAuthor} · <em>${art.source}</em> (${year}) · PMID: ${id}</div>
          </li>`;
      }).join("");

      papersHtml = `<ul class="paper-list">${items}</ul>`;
    }

    let seqHtml = "";
    if (links16s.isFungal) {
      seqHtml = `
        <p style="font-size:12px; color:#555; margin:4px 0;"><em>${org.species}</em> is a yeast (fungi use ITS/28S rRNA rather than prokaryotic 16S rRNA).</p>
        <a class="ext-link" href="${links16s.blastUrl}" target="_blank" rel="noopener">Open NCBI BLAST ↗</a>
      `;
    } else {
      let nucHitsHtml = "";
      try {
        const nucApi = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=nuccore&term=" + encodeURIComponent(links16s.nucTerm) + "&retmode=json&retmax=3";
        const nucResp = await fetch(nucApi);
        const nucJson = await nucResp.json();
        const nucIds = nucJson.esearchresult.idlist || [];

        if (nucIds.length > 0) {
          const nucSumApi = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=nuccore&id=" + nucIds.join(",") + "&retmode=json";
          const nucSumResp = await fetch(nucSumApi);
          const nucSumJson = await nucSumResp.json();

          nucHitsHtml = `<ul class="paper-list">` + nucIds.map(id => {
            const rec = nucSumJson.result[id] || {};
            const acc = rec.accessionversion || rec.caption || id;
            const title = rec.title || ("16S ribosomal RNA record (" + acc + ")");
            return `
              <li>
                <a class="paper-title" href="https://www.ncbi.nlm.nih.gov/nuccore/${encodeURIComponent(acc)}" target="_blank" rel="noopener">${title}</a>
                <div class="paper-meta">Accession: ${acc}</div>
              </li>`;
          }).join("") + `</ul>`;
        } else {
          const fallbackTerm = `"${org.species}"[Organism] AND "16S ribosomal RNA"`;
          nucHitsHtml = `<p style="font-size:12px; color:#555; margin:4px 0;">No strain-specific 16S record returned; try <a class="paper-title" style="display:inline;" href="https://www.ncbi.nlm.nih.gov/nuccore/?term=${encodeURIComponent(fallbackTerm)}" target="_blank" rel="noopener">species-level 16S search on NCBI Nucleotide ↗</a>.</p>`;
        }
      } catch (e) {
        nucHitsHtml = `<p style="font-size:12px; color:#555; margin:4px 0;">Use the links below to browse 16S rRNA records and run BLAST.</p>`;
      }

      seqHtml = `
        ${nucHitsHtml}
        <a class="ext-link" href="${links16s.nucSearchUrl}" target="_blank" rel="noopener">NCBI Nucleotide 16S Search ↗</a>
        <a class="ext-link" href="${links16s.blastUrl}" target="_blank" rel="noopener">NCBI BLAST (16S rRNA DB) ↗</a>
      `;
    }

    const rendered = `
      <div class="pubmed-header">
        <h3>${org.label}</h3>
        <span class="count-pill">${totalCount} PubMed ${totalCount === 1 ? "Study" : "Studies"}</span>
      </div>
      <div class="meta-line"><strong>Species:</strong> <em>${org.species}</em> · <strong>Strain:</strong> ${org.strain || "Not listed on label"}</div>
      ${papersHtml}
      <a class="ext-link" href="${pubmedSearchUrl}" target="_blank" rel="noopener">View all ${totalCount} results on NIH PubMed ↗</a>
      <div class="sec-box">
        <div class="sec-title">16S rRNA Sequence & BLAST</div>
        ${seqHtml}
      </div>
    `;

    cache[cacheKey] = rendered;
    panel.innerHTML = rendered;
  } catch (err) {
    panel.innerHTML = `
      <div class="pubmed-header"><h3>${org.label}</h3></div>
      <p style="font-size:12px; color:#b54700;">Could not load PubMed API data. <a href="${pubmedSearchUrl}" target="_blank" rel="noopener">Open search on PubMed ↗</a></p>
      <div class="sec-box">
        <div class="sec-title">16S rRNA Sequence & BLAST</div>
        <a class="ext-link" href="${links16s.nucSearchUrl}" target="_blank" rel="noopener">NCBI Nucleotide 16S Search ↗</a>
        <a class="ext-link" href="${links16s.blastUrl}" target="_blank" rel="noopener">NCBI BLAST (16S rRNA DB) ↗</a>
      </div>
    `;
  }
}

initSelect();
renderAll();
queryDetails(0);
</script>
</body>
</html>
