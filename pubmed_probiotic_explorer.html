<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Probiotic Sequencing & Live NIH PubMed Strain Explorer</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 12px; color: #222; background: #fafafa; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; }
  .control-group { display: flex; flex-direction: column; font-size: 13px; }
  .control-group label { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 740px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .panel-header { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #333; display: flex; justify-content: space-between; }
  .bar-row { display: flex; align-items: center; padding: 5px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid transparent; margin-bottom: 2px; }
  .bar-row:hover, .bar-row:focus { background: #eef6f3; border-color: #137356; outline: none; }
  .bar-row.active { background: #e3f2ed; border-color: #137356; font-weight: 600; }
  .strain-name { width: 165px; flex-shrink: 0; }
  .bar-track { flex-grow: 1; background: #eee; height: 14px; border-radius: 3px; overflow: hidden; margin: 0 8px; }
  .bar-fill { height: 100%; background: #137356; transition: width 0.15s ease; }
  .bar-val { width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  .pubmed-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; }
  .pubmed-header h3 { margin: 0; font-size: 15px; color: #137356; }
  .count-pill { background: #1b4f72; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .meta-line { font-size: 12px; color: #444; margin-bottom: 8px; }
  .paper-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
  .paper-list li { padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
  .paper-list li:last-child { border-bottom: none; }
  .paper-title { font-weight: 600; color: #1b4f72; text-decoration: none; display: block; margin-bottom: 2px; }
  .paper-title:hover { text-decoration: underline; }
  .paper-meta { color: #555; font-size: 11px; }
  .pubmed-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600; color: #137356; text-decoration: none; }
  .pubmed-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<main>
  <div class="controls" role="group" aria-label="Sequencing Simulation Parameters">
    <div class="control-group">
      <label for="reads">Sequencing Depth: <span id="reads-val">10,000</span> reads</label>
      <input type="range" id="reads" min="100" max="20000" step="100" value="10000">
    </div>
    <div class="control-group">
      <label for="contam">Cross-Contamination (% ASCU): <span id="contam-val">0%</span></label>
      <input type="range" id="contam" min="0" max="50" step="5" value="0">
    </div>
  </div>

  <div class="layout">
    <div class="panel" role="region" aria-label="Detected Probiotic Strains">
      <div class="panel-header">
        <span>JARR Community (Click a strain to query PubMed)</span>
        <span id="detected-summary" style="color:#137356;">10 / 10 detected</span>
      </div>
      <div id="bars"></div>
    </div>

    <div class="panel" id="pubmed-panel" aria-live="polite" aria-atomic="true">
      <p style="font-size:13px; color:#555; margin:0;">Select any strain on the left to search NIH PubMed for strain-specific peer-reviewed literature.</p>
    </div>
  </div>
</main>

<script>
const strains = [
  { label: "L. helveticus R0052", species: "Lactobacillus helveticus", code: "R0052", base: 15.2 },
  { label: "P. acidilactici R1001", species: "Pediococcus acidilactici", code: "R1001", base: 14.2 },
  { label: "B. longum BB536", species: "Bifidobacterium longum", code: "BB536", base: 13.2 },
  { label: "L. paracasei HA-196", species: "Lacticaseibacillus paracasei", code: "HA-196", base: 11.0 },
  { label: "B. breve R0070", species: "Bifidobacterium breve", code: "R0070", base: 10.2 },
  { label: "L. paracasei R0215", species: "Lacticaseibacillus paracasei", code: "R0215", base: 9.1 },
  { label: "B. longum R0175", species: "Bifidobacterium longum", code: "R0175", base: 8.9 },
  { label: "L. plantarum R1012", species: "Lactiplantibacillus plantarum", code: "R1012", base: 6.4 },
  { label: "L. lactis R1058", species: "Lactococcus lactis", code: "R1058", base: 6.3 },
  { label: "L. rhamnosus R0011", species: "Lacticaseibacillus rhamnosus", code: "R0011", base: 5.5 }
];

let selectedIdx = 0;
const cache = {}; // Cache API responses so rapid clicking doesn't hit NCBI rate limits

function seededNoise(seed) {
  const x = Math.sin(seed * 9999) * 10000;
  return x - Math.floor(x);
}

async function queryPubMed(idx) {
  selectedIdx = idx;
  renderBars();

  const s = strains[idx];
  const panel = document.getElementById('pubmed-panel');
  const queryTerm = `"${s.species}" AND "${s.code}"`;
  const pubmedSearchUrl = `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(queryTerm)}`;

  if (cache[idx]) {
    panel.innerHTML = cache[idx];
    return;
  }

  panel.innerHTML = `
    <div class="pubmed-header">
      <h3>${s.label}</h3>
      <span class="count-pill">Searching...</span>
    </div>
    <p style="font-size:12px; color:#555;">Querying NIH PubMed E-utilities for <em>${s.species}</em> strain <strong>${s.code}</strong>...</p>
  `;

  try {
    const searchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(queryTerm)}&retmode=json&retmax=3&sort=relevance`;
    const searchResp = await fetch(searchUrl);
    const searchJson = await searchResp.json();

    const totalCount = parseInt(searchJson.esearchresult.count, 10) || 0;
    const pmids = searchJson.esearchresult.idlist || [];

    let papersHtml = '';
    if (pmids.length === 0) {
      papersHtml = `<p style="font-size:12px; color:#555;">No PubMed articles indexed specifically with strain code <strong>${s.code}</strong>. Try searching at the species level on PubMed.</p>`;
    } else {
      const summaryUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${pmids.join(',')}&retmode=json`;
      const summaryResp = await fetch(summaryUrl);
      const summaryJson = await summaryResp.json();

      const items = pmids.map(id => {
        const art = summaryJson.result[id];
        const firstAuthor = art.authors && art.authors.length > 0 ? `${art.authors[0].name} et al.` : 'Author unlisted';
        const year = art.pubdate ? art.pubdate.slice(0, 4) : '';
        return `
          <li>
            <a class="paper-title" href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank" rel="noopener">${art.title}</a>
            <div class="paper-meta">${firstAuthor} · <em>${art.source}</em> (${year}) · PMID: ${id}</div>
          </li>`;
      }).join('');

      papersHtml = `<ul class="paper-list">${items}</ul>`;
    }

    const rendered = `
      <div class="pubmed-header">
        <h3>${s.label}</h3>
        <span class="count-pill">${totalCount} PubMed ${totalCount === 1 ? 'Study' : 'Studies'}</span>
      </div>
      <div class="meta-line"><strong>Species:</strong> <em>${s.species}</em> | <strong>Strain ID:</strong> ${s.code}</div>
      ${papersHtml}
      <a class="pubmed-link" href="${pubmedSearchUrl}" target="_blank" rel="noopener">View all ${totalCount} results on NIH PubMed ↗</a>
    `;

    cache[idx] = rendered;
    panel.innerHTML = rendered;
  } catch (err) {
    panel.innerHTML = `
      <div class="pubmed-header"><h3>${s.label}</h3></div>
      <p style="font-size:12px; color:#b54700;">Live API request blocked by browser/network. <a href="${pubmedSearchUrl}" target="_blank" rel="noopener">Open search directly in PubMed ↗</a></p>
    `;
  }
}

function renderBars() {
  const reads = parseInt(document.getElementById('reads').value, 10);
  const contam = parseInt(document.getElementById('contam').value, 10);
  document.getElementById('reads-val').textContent = reads.toLocaleString();
  document.getElementById('contam-val').textContent = contam + "%";

  const jarrFrac = (100 - contam) / 100;
  let detected = 0;
  const counts = strains.map((s, idx) => {
    const exp = (s.base / 100) * jarrFrac * reads;
    if (exp < 1.2 && seededNoise(reads + idx) > exp) return 0;
    const val = Math.round(exp);
    if (val > 0) detected++;
    return val;
  });

  const contamReads = Math.round((contam / 100) * reads);
  const total = counts.reduce((a, b) => a + b, 0) + contamReads;

  document.getElementById('detected-summary').textContent = `${detected} / 10 detected`;

  let html = strains.map((s, i) => {
    const pct = total > 0 ? (counts[i] / total) * 100 : 0;
    const isSelected = i === selectedIdx;
    return `
      <div class="bar-row ${isSelected ? 'active' : ''}" tabindex="0" role="button" aria-pressed="${isSelected}"
           onclick="queryPubMed(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();queryPubMed(${i});}">
        <span class="strain-name">${s.label}</span>
        <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${Math.min(100, pct * 4)}%;"></div></div>
        <span class="bar-val">${pct.toFixed(1)}%</span>
      </div>`;
  }).join('');

  if (contam > 0) {
    const uPct = (contamReads / total) * 100;
    html += `
      <div class="bar-row" style="cursor:default;">
        <span class="strain-name" style="color:#b54700; font-weight:600;">L. acidophilus (Unexpected)</span>
        <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${Math.min(100, uPct * 4)}%; background:#b54700;"></div></div>
        <span class="bar-val" style="color:#b54700; font-weight:600;">${uPct.toFixed(1)}%</span>
      </div>`;
  }

  document.getElementById('bars').innerHTML = html;
}

['reads', 'contam'].forEach(id => document.getElementById(id).addEventListener('input', renderBars));
renderBars();
queryPubMed(0);
</script>
</body>
</html>
