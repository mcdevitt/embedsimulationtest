  .panel-header { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #222; display: flex; justify-content: space-between; gap: 8px; }

  .org-btn { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 12.5px; border: 1px solid #e2e2e2; background: #fff; color: #222; margin-bottom: 5px; }

  .org-btn.active { background: #e3f2ed; border-color: #137356; font-weight: 600; }
  .strain-tag { font-size: 11px; background: #eef2f6; color: #1b4f72; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .sub-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid #e6e6e6; }
  .pubmed-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; gap: 8px; }
  .pubmed-header h3 { margin: 0; font-size: 15px; color: #137356; }
  .count-pill { background: #1b4f72; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .meta-line { font-size: 12px; color: #444; margin-bottom: 8px; }
  .paper-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
  .paper-list li { padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
  .paper-list li:last-child { border-bottom: none; }
  .paper-title { font-weight: 600; color: #1b4f72; text-decoration: none; display: block; margin-bottom: 2px; }
  .paper-title:hover { text-decoration: underline; }
  .paper-meta { color: #555; font-size: 11px; }
  .ext-link { display: inline-block; margin-top: 8px; margin-right: 12px; font-size: 12px; font-weight: 600; color: #137356; text-decoration: none; }
  .ext-link:hover { text-decoration: underline; }
  .dsld-item { padding: 6px 8px; border: 1px solid #ececec; border-radius: 4px; margin-bottom: 6px; font-size: 12px; background: #fcfcfc; }
  .dsld-status { font-size: 11px; font-weight: 600; color: #1b4f72; }
</style>

let currentCode = "JARR";
let selectedIdx = 0;
const pubmedCache = {};
const dsldCache = {};

function initSelect() {
  const sel = document.getElementById("product-select");
  sel.innerHTML = "";
  Object.keys(catalog).forEach(code => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${code} — ${catalog[code].fullTitle}`;
    if (code === currentCode) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    currentCode = sel.value;
    selectedIdx = 0;
    renderBannerAndList();
    queryPubMed(0);
    queryDSLD(currentCode);
  });
}

function renderList() {
  const orgs = catalog[currentCode].organisms;
  document.getElementById("org-count").textContent = `${orgs.length} listed ${orgs.length === 1 ? "organism" : "organisms"}`;
  document.getElementById("org-list").innerHTML = orgs.map((org, i) => {
    const isSelected = i === selectedIdx;
    return `
      <li>
        <button type="button" class="org-btn ${isSelected ? "active" : ""}" aria-pressed="${isSelected}" onclick="queryPubMed(${i})">
          <span>${org.label}</span>
          <span class="strain-tag">${org.strain || "Species only"}</span>
        </button>
      </li>`;
  }).join("");
}

function renderBannerAndList() {
  const item = catalog[currentCode];
  document.getElementById("brand-banner").innerHTML = `
    <div><strong>Sample ID:</strong> ${currentCode} · <strong>Product:</strong> ${item.fullTitle}</div>
    <div><strong>Biosafety:</strong> ${item.bsl}</div>
  `;
  renderList();
}

async function queryPubMed(idx) {
  selectedIdx = idx;
  renderList();

  const org = catalog[currentCode].organisms[idx];
  const panel = document.getElementById("pubmed-panel");
  const queryTerm = org.strain
    ? `"${org.species}" AND "${org.strain}"`
    : `"${org.species}" AND probiotic`;
  const cacheKey = `${org.species}|${org.strain}`;
  const pubmedSearchUrl = `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(queryTerm)}`;

  if (pubmedCache[cacheKey]) {
    panel.innerHTML = pubmedCache[cacheKey];
    return;
  }

  panel.innerHTML = `
    <div class="pubmed-header">
      <h3>${org.label}</h3>
      <span class="count-pill">Searching...</span>
    </div>
    <p style="font-size:12px; color:#555;">Querying NIH PubMed...</p>
  `;

  try {
    const searchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(queryTerm)}&retmode=json&retmax=3&sort=relevance`;
    const searchResp = await fetch(searchUrl);
    const searchJson = await searchResp.json();

    const totalCount = parseInt(searchJson.esearchresult.count, 10) || 0;
    const pmids = searchJson.esearchresult.idlist || [];

    let papersHtml = "";
    if (pmids.length === 0) {
      papersHtml = `<p style="font-size:12px; color:#555;">No exact PubMed matches found. Use the link below to search directly on PubMed.</p>`;
    } else {
      const summaryUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${pmids.join(",")}&retmode=json`;
      const summaryResp = await fetch(summaryUrl);
      const summaryJson = await summaryResp.json();

      const items = pmids.map(id => {
        const art = summaryJson.result[id];
        const firstAuthor = art.authors && art.authors.length > 0 ? `${art.authors[0].name} et al.` : "Author unlisted";
        const year = art.pubdate ? art.pubdate.slice(0, 4) : "";
        return `
          <li>
            <a class="paper-title" href="https://pubmed.ncbi.nlm.nih.gov/${id}/" target="_blank" rel="noopener">${art.title}</a>
            <div class="paper-meta">${firstAuthor} · <em>${art.source}</em> (${year}) · PMID: ${id}</div>
          </li>`;
      }).join("");

      papersHtml = `<ul class="paper-list">${items}</ul>`;
    }

    const rendered = `
      <div class="pubmed-header">
        <h3>${org.label}</h3>
        <span class="count-pill">${totalCount} PubMed ${totalCount === 1 ? "Study" : "Studies"}</span>
      </div>
      <div class="meta-line"><strong>Species:</strong> <em>${org.species}</em> · <strong>Strain:</strong> ${org.strain || "Not listed on label"}</div>
      ${papersHtml}
      <a class="ext-link" href="${pubmedSearchUrl}" target="_blank" rel="noopener">View all ${totalCount} results on NIH PubMed ↗</a>
    `;

    pubmedCache[cacheKey] = rendered;
    panel.innerHTML = rendered;
  } catch (err) {
    panel.innerHTML = `
      <div class="pubmed-header"><h3>${org.label}</h3></div>
      <p style="font-size:12px; color:#b54700;">Could not load PubMed API data. <a href="${pubmedSearchUrl}" target="_blank" rel="noopener">Open search on PubMed ↗</a></p>
    `;
  }
}

async function queryDSLD(code) {
  const item = catalog[code];
  const dsldPanel = document.getElementById("dsld-panel");
  const dsldWebSearchUrl = `https://dsld.od.nih.gov/search/${encodeURIComponent(item.dsldQuery)}`;

  if (dsldCache[code]) {
    dsldPanel.innerHTML = dsldCache[code];
    return;
  }

  dsldPanel.innerHTML = `
    <div class="pubmed-header">
      <h3>NIH DSLD Label Cross-Reference</h3>
      <span class="count-pill">Checking DSLD...</span>
    </div>
    <p style="font-size:12px; color:#555;">Checking NIH Dietary Supplement Label Database for <strong>${item.fullTitle}</strong>...</p>
  `;

  try {
    const apiUrl = `https://api.ods.od.nih.gov/dsld/v9/browse-products/?q=${encodeURIComponent(item.dsldQuery)}&size=5`;
    const resp = await fetch(apiUrl);
    const data = await resp.json();
    const hits = Array.isArray(data.hits) ? data.hits : (Array.isArray(data.results) ? data.results : []);
    const totalHits = typeof data.total === "number" ? data.total : hits.length;

    let matchesHtml = "";
    if (hits.length === 0) {
      matchesHtml = `<p style="font-size:12px; color:#555;">No direct DSLD label match returned for this query. Use the NIH DSLD search link below to check alternate product spellings or historical labels.</p>`;
    } else {
      matchesHtml = hits.slice(0, 4).map(h => {
        const title = h.fullName || h.productName || h.name || "DSLD Label Record";
        const brand = h.brandName || h.brand || item.brand;
        const status = h.offMarket === true || String(h.marketStatus || "").toLowerCase().includes("off") ? "Off Market" : "On Market";
        const idVal = h.dsldId || h.id || "";
        const labelUrl = idVal ? `https://dsld.od.nih.gov/label/${idVal}` : dsldWebSearchUrl;
        return `
          <div class="dsld-item">
            <a class="paper-title" href="${labelUrl}" target="_blank" rel="noopener">${title}</a>
            <div class="paper-meta">Brand: ${brand} · <span class="dsld-status">${status}</span>${idVal ? ` · DSLD ID: ${idVal}` : ""}</div>
          </div>`;
      }).join("");
    }

    const rendered = `
      <div class="pubmed-header">
        <h3>NIH DSLD Label Cross-Reference</h3>
        <span class="count-pill">${totalHits} DSLD ${totalHits === 1 ? "Match" : "Matches"}</span>
      </div>
      <div class="meta-line"><strong>Spreadsheet Label:</strong> ${item.fullTitle}</div>
      ${matchesHtml}
      <a class="ext-link" href="${dsldWebSearchUrl}" target="_blank" rel="noopener">Search NIH DSLD Database ↗</a>
    `;

    dsldCache[code] = rendered;
    dsldPanel.innerHTML = rendered;
  } catch (err) {
    const fallback = `
      <div class="pubmed-header">
        <h3>NIH DSLD Label Cross-Reference</h3>
      </div>
      <p style="font-size:12px; color:#555;">Live DSLD lookup could not be loaded in this view. Compare your spreadsheet label directly against the <a class="paper-title" style="display:inline;" href="${dsldWebSearchUrl}" target="_blank" rel="noopener">NIH Dietary Supplement Label Database ↗</a>.</p>
    `;
    dsldCache[code] = fallback;
    dsldPanel.innerHTML = fallback;
  }
}
