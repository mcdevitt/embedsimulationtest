<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assigned Probiotic & Live NIH PubMed Literature Explorer</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 12px; color: #222; background: #fafafa; }
  .top-bar { background: #fff; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; font-size: 13px; max-width: 580px; }
  .field label { font-weight: 600; margin-bottom: 4px; }
  select { padding: 7px 9px; border: 1px solid #bbb; border-radius: 4px; font-size: 13px; background: #fff; color: #222; }
  .brand-banner { background: #eef6f3; border: 1px solid #cce3da; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .layout { display: grid; grid-template-columns: 1.05fr 1.25fr; gap: 12px; align-items: start; }
  @media (max-width: 740px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .panel-header { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #222; display: flex; justify-content: space-between; }
  .org-list { list-style: none; padding: 0; margin: 0; max-height: 360px; overflow-y: auto; }
  .org-btn { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 4px; cursor: pointer; font-size: 12.5px; border: 1px solid #e2e2e2; background: #fff; color: #222; margin-bottom: 5px; }
  .org-btn:hover, .org-btn:focus { background: #eef6f3; border-color: #137356; outline: 2px solid #137356; outline-offset: 1px; }
  .org-btn.active { background: #e3f2ed; border-color: #137356; font-weight: 600; }
  .strain-tag { font-size: 11px; background: #eef2f6; color: #1b4f72; padding: 2px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .pubmed-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-bottom: 8px; gap: 8px; }
  .pubmed-header h3 { margin: 0; font-size: 15px; color: #137356; }
  .count-pill { background: #1b4f72; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .meta-line { font-size: 12px; color: #444; margin-bottom: 8px; }
  .paper-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
  .paper-list li { padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
  .paper-list li:last-child { border-bottom: none; }
  .paper-title { font-weight: 600; color: #1b4f72; text-decoration: none; display: block; margin-bottom: 2px; }
  .paper-title:hover { text-decoration: underline; }
  .paper-meta { color: #555; font-size: 11px; }
  .pubmed-link { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600; color: #137356; text-decoration: none; }
  .pubmed-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<main>
  <div class="top-bar" role="group" aria-label="Assigned Probiotic Selection">
    <div class="field">
      <label for="product-select">Select Your Assigned Probiotic Sample:</label>
      <select id="product-select"></select>
    </div>
  </div>

  <div class="brand-banner" id="brand-banner" aria-live="polite"></div>

  <div class="layout">
    <div class="panel" role="region" aria-label="Listed Label Organisms">
      <div class="panel-header">
        <span>Listed Label Organisms (Click to search PubMed)</span>
        <span id="org-count" style="color:#137356;"></span>
      </div>
      <ul class="org-list" id="org-list"></ul>
    </div>

    <div class="panel" id="pubmed-panel" aria-live="polite" aria-atomic="true"></div>
  </div>
</main>
